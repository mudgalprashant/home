name: CI

# Gate every PR on lint + typecheck + build + dependency audit before Vercel
# builds a preview from it (KB/system-design.md §10, KB/security.md §5.1).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Fails the build on a known high/critical CVE in the dependency tree.
      # Moderate and below are reported by Dependabot rather than blocking here,
      # so routine advisories don't wedge every open PR.
      - name: Audit dependencies
        run: npm run audit:ci
